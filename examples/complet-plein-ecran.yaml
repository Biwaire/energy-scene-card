type: custom:energy-scene-card
title: Ma maison
fullscreen: true
landscape_fullscreen: true
pill_size: small
solar_entity: sensor.production_solaire
grid_entity: sensor.puissance_reseau
batteries:
  - { name: Batterie 1, power_entity: sensor.batterie_1_puissance, soc_entity: sensor.batterie_1_niveau }
  - { name: Batterie 2, power_entity: sensor.batterie_2_puissance, soc_entity: sensor.batterie_2_niveau }
extras:
  - { name: Chauffe-eau, entity: sensor.chauffe_eau_puissance, icon: water-heater }
chips:
  - { name: Extérieur, entity: sensor.temperature_exterieure, icon: temperature }
  - { name: Lever, entity: sensor.sun_next_rising, icon: sunrise }
  - { name: Coucher, entity: sensor.sun_next_setting, icon: sunset }
details:
  title: Détails
  stats:
    - { name: Production du jour, entity: sensor.production_jour, icon: sun }
    - { name: Prévision demain, entity: sensor.prevision_demain, icon: sun }
    - { name: Injection, entity: sensor.injection_jour, icon: bolt }
  toggle:
    entity: input_boolean.mode_auto
    name: Auto / Manuel
    message_on: "Mode automatique actif."
    message_off: "Mode manuel."
